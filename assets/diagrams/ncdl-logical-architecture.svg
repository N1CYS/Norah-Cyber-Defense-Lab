<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Planned NCDL logical architecture</title>
  <desc id="desc">A planned segmented cyber defense lab with firewall routing, identity services, Windows and Linux endpoints, security monitoring, network sensors, and an isolated Kali Linux validation zone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1c2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14263a"/>
      <stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020812" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#53c8d8"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef6a78"/>
    </marker>
    <style>
      .heading { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #f3f7fb; letter-spacing: .4px; }
      .subheading { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #9fb0c3; }
      .label { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #6dd8e6; letter-spacing: 1.1px; }
      .title { font: 700 19px Inter, Segoe UI, Arial, sans-serif; fill: #edf5fb; }
      .body { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #aebed0; }
      .small { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #8da2b8; letter-spacing: .4px; }
      .zone { fill: url(#panel); stroke: #28435c; stroke-width: 1.5; }
      .zone-accent { fill: #102b38; stroke: #3faabe; stroke-width: 1.5; }
      .zone-red { fill: #291924; stroke: #a84b5b; stroke-width: 1.5; }
      .flow { fill: none; stroke: #53c8d8; stroke-width: 2.2; marker-end: url(#arrow); }
      .telemetry { fill: none; stroke: #53c8d8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); opacity: .88; }
      .restricted { fill: none; stroke: #ef6a78; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect width="1400" height="820" rx="18" fill="url(#bg)"/>
  <path d="M0 118 H1400" stroke="#1e354b"/>
  <text x="60" y="57" class="heading">Norah Cyber Defense Lab</text>
  <text x="60" y="88" class="subheading">Planned logical architecture · segmented telemetry and investigation environment</text>
  <rect x="1162" y="40" width="178" height="38" rx="19" fill="#132c3a" stroke="#3faabe"/>
  <text x="1251" y="64" text-anchor="middle" class="small" fill="#70d9e6">PLANNED DESIGN</text>

  <rect x="50" y="160" width="220" height="130" rx="14" class="zone-accent" filter="url(#shadow)"/>
  <text x="74" y="191" class="label">NETWORK EDGE</text>
  <text x="74" y="227" class="title">OPNsense / pfSense</text>
  <text x="74" y="253" class="body">Firewall · NAT · routing</text>
  <text x="74" y="274" class="body">Default-deny segmentation</text>

  <rect x="340" y="145" width="290" height="150" rx="14" class="zone" filter="url(#shadow)"/>
  <text x="366" y="178" class="label">IDENTITY / SERVER ZONE</text>
  <text x="366" y="215" class="title">Active Directory</text>
  <text x="366" y="242" class="body">AD DS · DNS · authentication</text>
  <text x="366" y="268" class="small">PLANNED RESTRICTED WORKLOAD TIER</text>

  <rect x="340" y="350" width="290" height="128" rx="14" class="zone" filter="url(#shadow)"/>
  <text x="366" y="383" class="label">WINDOWS USER ZONE</text>
  <text x="366" y="420" class="title">Windows Endpoints</text>
  <text x="366" y="448" class="body">Identity · process · endpoint telemetry</text>

  <rect x="340" y="535" width="290" height="128" rx="14" class="zone" filter="url(#shadow)"/>
  <text x="366" y="568" class="label">LINUX ZONE</text>
  <text x="366" y="605" class="title">Linux Endpoint</text>
  <text x="366" y="633" class="body">Authentication · audit · host telemetry</text>

  <rect x="735" y="145" width="320" height="210" rx="14" class="zone-accent" filter="url(#shadow)"/>
  <text x="763" y="178" class="label">SOC / SECURITY ZONE</text>
  <text x="763" y="215" class="title">Central Analysis</text>
  <text x="763" y="244" class="body">Splunk and/or Elastic</text>
  <text x="763" y="272" class="body">Wazuh · Velociraptor</text>
  <path d="M763 294 H1025" stroke="#29516a"/>
  <text x="763" y="323" class="small">SEARCH · DETECT · HUNT · COLLECT</text>

  <rect x="735" y="415" width="320" height="164" rx="14" class="zone" filter="url(#shadow)"/>
  <text x="763" y="448" class="label">NETWORK SENSOR ZONE</text>
  <text x="763" y="485" class="title">Zeek · Suricata</text>
  <text x="763" y="513" class="body">Network metadata · IDS alerts</text>
  <text x="763" y="540" class="small">PLANNED MIRRORED TRAFFIC</text>

  <rect x="1125" y="415" width="225" height="164" rx="14" class="zone-red" filter="url(#shadow)"/>
  <text x="1151" y="448" class="small" fill="#ef8994">ISOLATED ADVERSARY ZONE</text>
  <text x="1151" y="487" class="title">Kali Linux</text>
  <text x="1151" y="515" class="body">Controlled validation only</text>
  <text x="1151" y="542" class="small" fill="#d98c96">DENIED BY DEFAULT</text>

  <path d="M270 222 H340" class="flow"/>
  <path d="M270 232 C305 232 305 414 340 414" class="flow"/>
  <path d="M270 242 C305 242 305 599 340 599" class="flow"/>
  <path d="M630 220 H735" class="telemetry"/>
  <path d="M630 414 C680 414 680 265 735 265" class="telemetry"/>
  <path d="M630 599 C680 599 680 305 735 305" class="telemetry"/>
  <path d="M735 500 C690 500 690 290 630 290" class="telemetry"/>
  <path d="M895 415 V355" class="telemetry"/>
  <path d="M1125 500 H1055" class="restricted"/>

  <rect x="50" y="726" width="1300" height="54" rx="10" fill="#0c1827" stroke="#223b52"/>
  <line x1="82" y1="753" x2="132" y2="753" class="telemetry"/>
  <text x="148" y="758" class="body">Planned telemetry flow</text>
  <line x1="357" y1="753" x2="407" y2="753" class="restricted"/>
  <text x="423" y="758" class="body">Temporary scoped validation path</text>
  <text x="1318" y="758" text-anchor="end" class="small">NOT DEPLOYMENT EVIDENCE</text>
</svg>
