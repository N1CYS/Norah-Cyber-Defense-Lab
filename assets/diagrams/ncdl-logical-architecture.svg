<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">NCDL v1 logical architecture</title>
  <desc id="desc">The implemented NCDL lab uses VMware Workstation, OPNsense, one 10.10.10.0/24 LAN, a Windows Server domain controller, and a Wazuh all-in-one server. A Windows 11 host reaches the Wazuh Dashboard through restricted OPNsense Destination NAT and firewall access.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0c1b2d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15283c"/>
      <stop offset="1" stop-color="#0f1e30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020812" flood-opacity="0.46"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#58c9da"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#61d69b"/>
    </marker>
    <style>
      .heading { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #f3f7fb; }
      .subheading { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #9fb0c3; }
      .label { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #6dd8e6; letter-spacing: 1px; }
      .title { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #edf5fb; }
      .body { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #aebed0; }
      .small { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #8da2b8; letter-spacing: .35px; }
      .panel { fill: url(#panel); stroke: #2b465f; stroke-width: 1.5; }
      .edge { fill: #102c39; stroke: #45afc1; stroke-width: 1.6; }
      .lan { fill: #0b1828; stroke: #31516b; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .flow { fill: none; stroke: #58c9da; stroke-width: 2.3; marker-end: url(#arrow); }
      .telemetry { fill: none; stroke: #61d69b; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .restricted { fill: none; stroke: #f1b65c; stroke-width: 2.3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="720" rx="18" fill="url(#background)"/>
  <path d="M0 116 H1400" stroke="#1e354b"/>
  <text x="56" y="55" class="heading">Norah Cyber Defense Lab · v1</text>
  <text x="56" y="86" class="subheading">Implemented core architecture · VMware Workstation · OPNsense · Active Directory · Wazuh</text>
  <rect x="1160" y="39" width="184" height="38" rx="19" fill="#15352e" stroke="#54bf8d"/>
  <text x="1252" y="63" text-anchor="middle" class="small" fill="#79dfa9">CORE OPERATIONAL</text>

  <rect x="54" y="176" width="250" height="142" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="80" y="209" class="label">ANALYST ACCESS</text>
  <text x="80" y="247" class="title">Windows 11 Host</text>
  <text x="80" y="275" class="body">Wazuh Dashboard browser</text>
  <text x="80" y="298" class="small">NOT ATTACHED TO LAB LAN</text>

  <rect x="54" y="402" width="250" height="130" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="80" y="435" class="label">UPSTREAM NETWORK</text>
  <text x="80" y="473" class="title">VMware NAT</text>
  <text x="80" y="501" class="body">OPNsense WAN connection</text>

  <rect x="380" y="288" width="260" height="156" rx="14" class="edge" filter="url(#shadow)"/>
  <text x="408" y="322" class="label">NETWORK BOUNDARY</text>
  <text x="408" y="360" class="title">OPNsense</text>
  <text x="408" y="388" class="body">Firewall · router · Destination NAT</text>
  <text x="408" y="417" class="small">LAN GATEWAY · 10.10.10.1/24</text>

  <rect x="718" y="154" width="628" height="430" rx="18" class="lan"/>
  <text x="748" y="190" class="label">NCDL LAN · 10.10.10.0/24</text>

  <rect x="760" y="230" width="250" height="262" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="786" y="264" class="label">IDENTITY + ENDPOINT</text>
  <text x="786" y="302" class="title">NCDL-DC01</text>
  <text x="786" y="331" class="body">Windows Server 2022</text>
  <text x="786" y="358" class="body">AD DS · DNS</text>
  <path d="M786 379 H984" stroke="#2b465f"/>
  <text x="786" y="407" class="body">Wazuh agent 001 · Active</text>
  <text x="786" y="435" class="body">Windows security telemetry</text>
  <text x="786" y="466" class="small">STATIC · 10.10.10.10</text>

  <rect x="1054" y="230" width="250" height="262" rx="14" class="panel" filter="url(#shadow)"/>
  <text x="1080" y="264" class="label">SECURITY MONITORING</text>
  <text x="1080" y="302" class="title">NCDL-SIEM01</text>
  <text x="1080" y="331" class="body">Ubuntu Server 24.04 LTS</text>
  <text x="1080" y="358" class="body">Wazuh 4.14.7 all-in-one</text>
  <path d="M1080 379 H1278" stroke="#2b465f"/>
  <text x="1080" y="407" class="body">Manager · Indexer · Dashboard</text>
  <text x="1080" y="435" class="body">Operational</text>
  <text x="1080" y="466" class="small">STATIC · 10.10.10.20</text>

  <path d="M304 465 C340 465 340 392 380 392" class="flow"/>
  <path d="M640 366 H718" class="flow"/>
  <path d="M1010 362 H1054" class="telemetry"/>
  <text x="1032" y="344" text-anchor="middle" class="small" fill="#79dfa9">TELEMETRY</text>
  <path d="M304 247 C342 247 342 330 380 330" class="restricted"/>
  <path d="M640 330 C681 330 681 215 1054 215 C1178 215 1178 230 1178 230" class="restricted"/>
  <text x="512" y="244" text-anchor="middle" class="small" fill="#f1c97f">RESTRICTED DASHBOARD ACCESS</text>

  <rect x="54" y="627" width="1292" height="52" rx="10" fill="#0c1827" stroke="#223b52"/>
  <line x1="85" y1="653" x2="135" y2="653" class="telemetry"/>
  <text x="151" y="658" class="body">Validated Windows telemetry path</text>
  <line x1="399" y1="653" x2="449" y2="653" class="restricted"/>
  <text x="465" y="658" class="body">Restricted Destination NAT / firewall path</text>
  <text x="1315" y="658" text-anchor="end" class="small">NO CUSTOM DETECTION OR INVESTIGATION CLAIM</text>
</svg>
